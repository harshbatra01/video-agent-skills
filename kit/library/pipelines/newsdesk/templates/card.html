<!doctype html><html><head><meta charset="utf-8"><style>
/*FONTS*/
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent;overflow:hidden}
#c{position:relative;overflow:hidden}
.abs{position:absolute}
.cover{width:100%;height:100%;object-fit:cover;display:block}
.hl{color:var(--accent)}
.hl2,.meme .hl,.split .hl{color:var(--accent2)}
.emo{height:.92em;width:auto;vertical-align:-.13em;margin-left:.06em}
.word{font-family:VCSemi;letter-spacing:.34em;color:#fff;font-size:26px;opacity:.92}
.label{display:inline-block;font-family:VCBox;text-transform:uppercase;font-size:30px;letter-spacing:.07em;background:var(--accent);color:#000;padding:9px 18px 6px;border-radius:6px}
.ring{border-radius:50%;overflow:hidden;border:10px solid #fff;box-shadow:0 10px 30px rgba(0,0,0,.5)}
</style></head><body><div id="c"></div><script>
const D=/*DATA*/null;
const W=D.w,H=D.h,V=!!D.video,C=document.getElementById('c');
C.style.width=W+'px';C.style.height=H+'px';C.className=D.fmt;
document.body.style.width=W+'px';document.body.style.height=H+'px';
const R=document.documentElement.style;R.setProperty('--accent',D.brand.accent);R.setProperty('--accent2',D.brand.accent2);
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
// *x* = accent, ^x^ = red. Numbers always get the accent colour too (Jaden, 8 Oct: "hard code number in dif colour like #68"),
// except on tweet cards (auto=false: real tweets have no colour), with autohl:false, and in names like 21 Savage / 50 Cent.
const NUM=/(^|[\s(\/'"‘“;-])((?:#|\$|£)?\d(?:[\d,.]*\d)?(?:\s?(?:BILLION|MILLION|BN|K|M|B|%|PM|AM)\b)?\+?)(?=$|[\s),.!?:;'"’”\/-])/gi;
const NUM_SKIP=/^(21 SAVAGE|50 CENT|42 DUGG|24KGOLDN|1017)/i;
function rich(s,auto){const parts=esc(s).split(/(\*[^*]+\*|\^[^^]+\^)/);
  let t=parts.map((p,i)=>i%2?'<span class="'+(p[0]==='*'?'hl':'hl2')+'">'+p.slice(1,-1)+'</span>'
    :(auto===false||D.autohl===false)?p:p.replace(NUM,(m,a,n,off,str)=>NUM_SKIP.test(str.slice(off+a.length))?m:a+'<span class="hl">'+n+'</span>')).join('');
  for(const k of Object.keys(D.emoji||{}).sort((a,b)=>b.length-a.length))t=t.split(k).join('<img class="emo" src="'+D.emoji[k]+'">');return t}
function plain(s){return String(s||'').replace(/[*^]/g,'')}
function el(tag,cls,css,html){const e=document.createElement(tag);if(cls)e.className=cls;if(css)e.style.cssText=css;if(html!=null)e.innerHTML=html;return e}
function img(src,css,focus){const e=el('img','cover',css||'');e.src=src;if(focus)e.style.objectPosition=focus;return e}
function boxImg(src,css,focus){const b=el('div','abs',css+';overflow:hidden');b.appendChild(img(src,'',focus));C.appendChild(b);return b}
function fit(e,max,min,maxH){let f=max;e.style.fontSize=f+'px';while(f>min&&(e.scrollHeight>maxH||e.scrollWidth>e.clientWidth+2)){f-=2;e.style.fontSize=f+'px'}return f}
// our page handle with its pfp ("@zonegbp"), or brand.logo when one is set. css = position; inline = return it instead of placing it
function wordmark(css,col,just,inline){let w;
  if(D.brand.logo){w=el('img',inline?'':'abs',css+';height:46px;width:auto');w.src=D.brand.logo}
  else{w=el('div',inline?'':'abs',css+';display:flex;align-items:center;gap:12px;justify-content:'+(just||'center'));
    if(D.brand.avatar){const a=el('img','','width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.9);flex:none');a.src=D.brand.avatar;w.appendChild(a)}
    w.appendChild(el('span','','font-family:VCBox;font-size:31px;color:'+(col||'#fff')+';text-shadow:0 2px 10px rgba(0,0,0,.55)',esc(D.brand.handle||D.brand.wordmark)))}
  if(inline)return w;C.appendChild(w)}
// platform logo badge (Apple Music, Spotify...): app-icon tile from vcn.py (simple-icons glyph or an image file)
function logoTile(s){const L=D.logo,t=el('div','','width:'+s+'px;height:'+s+'px;border-radius:'+Math.round(s*.23)+'px;overflow:hidden;flex:none;box-shadow:0 8px 24px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;background:'+(L.bg||'#fff'));
  if(L.svg){t.innerHTML=L.svg;const g=t.querySelector('svg'),z=Math.round(s*(L.scale||.6));g.setAttribute('width',z);g.setAttribute('height',z);g.style.fill=L.fg||'#fff'}
  else t.appendChild(img(L.src));
  return t}

// F1 UK headline card (also V3 headline over clip, and V5 quote with pos "top")
function uk(){const top=D.pos==='top';
  if(!V&&D.photo)C.appendChild(img(D.photo,'position:absolute;inset:0',D.focus||'center 30%'));
  C.appendChild(el('div','abs','left:0;right:0;'+(top?'top:0':'bottom:0')+';height:'+(V?'54%':'64%')+';background:linear-gradient('+(top?'0deg':'180deg')+',rgba(0,0,0,0) 0%,rgba(0,0,0,.6) 45%,rgba(0,0,0,.93) 100%)'));
  if(D.inset){const s=D.inset.size||300,r=el('div','abs ring','left:'+(D.inset.x||56)+'px;top:'+(D.inset.y||(V?240:56))+'px;width:'+s+'px;height:'+s+'px');r.appendChild(img(D.inset.src,'',D.inset.focus||'center 25%'));C.appendChild(r)}
  const box=el('div','abs','left:60px;right:60px;text-align:center;'+(top?'top:'+(V?250:90)+'px':'bottom:'+(V?340:118)+'px'));
  if(V)box.appendChild(wordmark('margin-bottom:20px','#fff','center',true));          // videos: handle sits over the headline like a byline
  if(D.logo||D.label){const r=el('div','','margin-bottom:22px;display:flex;align-items:center;justify-content:center;gap:16px');
    if(D.logo)r.appendChild(logoTile(V?118:100));
    if(D.label)r.appendChild(el('span','label',V?'font-size:36px':'',esc(D.label)));
    box.appendChild(r)}
  const q1=D.quote?'<span class="hl">“</span>':'',q2=D.quote?'<span class="hl">”</span>':'';
  // cards: condensed VCHead; videos: bold VCBox (reads better on a phone, matches the split caption box)
  const h=el('div','','font-family:'+(V?'VCBox':'VCHead')+';text-transform:uppercase;color:#fff;line-height:'+(V?1.04:.94)+';text-shadow:0 4px 18px rgba(0,0,0,.35)',q1+rich(D.headline)+q2);box.appendChild(h);
  if(D.sub)box.appendChild(el('div','','font-family:VCSemi;color:#ddd;font-size:34px;margin-top:16px;letter-spacing:.06em;text-transform:uppercase',esc(D.sub)));
  C.appendChild(box);
  if(!V)wordmark('bottom:40px;left:0;right:0');
  return[()=>fit(h,V?100:140,V?48:56,V?470:430)]}

// F2 RapTV-style card
function raptv(){const ph=Math.round(H*.6);C.style.background='#000';
  boxImg(D.photo,'left:0;top:0;width:100%;height:'+ph+'px',D.focus||'center 25%');
  C.appendChild(el('div','abs','left:0;right:0;top:'+ph+'px;height:8px;background:var(--accent)'));
  if(D.badge)C.appendChild(el('div','abs','left:40px;top:40px;font-family:VCBox;font-size:30px;color:#fff;background:rgba(0,0,0,.62);padding:9px 16px 6px;border-radius:6px;letter-spacing:.07em',esc(D.badge)));
  const h=el('div','abs','left:54px;right:54px;top:'+(ph+42)+'px;font-family:VCHead;text-transform:uppercase;color:#fff;line-height:.93',rich(D.headline));C.appendChild(h);
  wordmark('left:54px;bottom:32px','var(--accent)','flex-start');
  return[()=>fit(h,150,60,H-ph-42-100)]}

// F3 meme header (also V2 header over clip: band only, clip placed below by ffmpeg)
function meme(){const band=D.band||(V?460:380);
  if(!V){C.style.background='#000';if(D.photo)boxImg(D.photo,'left:0;right:0;top:'+band+'px;bottom:0',D.focus||'center 30%')}
  const b=el('div','abs','left:0;right:0;top:0;height:'+band+'px;background:#fff;display:flex;align-items:center;justify-content:center;padding:26px 46px');
  const t=el('div','','font-family:VCMeme;color:#000;text-align:center;line-height:1.08;width:100%',rich(D.headline));b.appendChild(t);C.appendChild(b);
  (D.faces||[]).forEach(f=>{const s=f.size||260,r=el('div','abs','left:'+f.x+'px;top:'+f.y+'px;width:'+s+'px;height:'+s+'px;border-radius:50%;overflow:hidden;border:9px solid #FF2D2D;box-shadow:0 8px 24px rgba(0,0,0,.45)');r.appendChild(img(f.src,'',f.focus||'center 25%'));C.appendChild(r)});
  return[()=>fit(t,96,44,band-52)]}

// F4 own tweet card (also V4 tweet card over clip)
function tweet(){
  const shot=!V&&!D.photo_bg;   // cards: real tweet-screenshot look (image inside the tweet); photo_bg:true = old photo-behind-card look
  if(!V&&D.photo&&!shot){C.appendChild(img(D.photo,'position:absolute;inset:0',D.focus||'center 30%'));C.appendChild(el('div','abs','left:0;right:0;top:0;height:60%;background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,0))'))}
  const dk=(D.tweet_style||D.brand.tweet_style)==='dark',bg=dk?'#000':'#fff',ink=dk?'#e7e9ea':'#0f1419',sub=dk?'#71767b':'#536471';
  if(shot)C.style.background=bg;
  const card=shot?el('div','abs','left:0;right:0;top:50%;transform:translateY(-50%);padding:0 72px;background:'+bg)
    :el('div','abs','left:54px;right:54px;top:'+(V?(D.cardY||250):60)+'px;background:'+bg+';border-radius:30px;padding:38px 42px 40px;box-shadow:0 12px 40px rgba(0,0,0,.35);'+(dk?'border:2px solid #2f3336':''));
  const av=D.brand.avatar?'<img src="'+D.brand.avatar+'" style="width:96px;height:96px;border-radius:50%;object-fit:cover">':'<div style="width:96px;height:96px;border-radius:50%;background:#000;color:var(--accent);font-family:VCHead;font-size:58px;display:flex;align-items:center;justify-content:center">'+esc(D.brand.wordmark[0])+'</div>';
  const tick=D.brand.verified?'<svg viewBox="0 0 24 24" width="36" height="36" style="vertical-align:-6px;margin-left:8px"><circle cx="12" cy="12" r="11" fill="#1D9BF0"/><path d="M7 12.5l3.2 3.2L17 9" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>':'';
  card.innerHTML='<div style="display:flex;align-items:center;gap:22px;margin-bottom:26px">'+av+'<div><div style="font-family:VCTwB;font-size:40px;color:'+ink+'">'+esc(D.brand.display_name)+tick+'</div><div style="font-family:VCTw;font-size:32px;color:'+sub+'">'+esc(D.brand.handle)+'</div></div></div>';
  const t=el('div','','font-family:VCTw;color:'+ink+';line-height:1.28',rich(plain(D.headline),false));card.appendChild(t);C.appendChild(card);
  let pic=null;if(shot&&D.photo){pic=el('div','','margin-top:32px;border-radius:30px;overflow:hidden;border:1px solid '+(dk?'#2f3336':'#cfd9de')+';height:'+(D.ph||620)+'px');pic.appendChild(img(D.photo,'',D.focus||'center 30%'));card.appendChild(pic)}
  return[()=>{fit(t,62,36,V?520:(shot?(D.photo?340:820):460));if(pic){const over=card.offsetHeight-(H-110);if(over>0)pic.style.height=Math.max(360,(D.ph||620)-over)+'px'}}]}

// F5 chart / data card
function chart(){C.style.background='#0b0b0b';
  if(D.cover)C.appendChild(img(D.cover,'position:absolute;left:-60px;top:-60px;width:calc(100% + 120px);height:calc(100% + 120px);filter:blur(46px) brightness(.38)'));
  const col=el('div','abs','left:60px;right:60px;top:60px;bottom:100px;display:flex;flex-direction:column;align-items:center;text-align:center');
  col.appendChild(el('div','','font-family:VCBox;font-size:34px;letter-spacing:.14em;color:var(--accent);margin-bottom:34px',esc(D.chart||'')));
  const cv=el('div','','width:600px;height:600px;flex:none;border-radius:14px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6)');cv.appendChild(img(D.cover));col.appendChild(cv);
  const mv=String(D.move||'');let m='';
  if(mv==='NEW')m='<span style="background:var(--accent);color:#000;padding:8px 18px 4px;border-radius:8px;font-size:44px;font-family:VCBox;vertical-align:middle">NEW</span>';
  else if(mv[0]==='+')m='<span style="color:#30D158;font-family:VCNum;font-weight:700;font-size:64px;vertical-align:middle">▲'+esc(mv.slice(1))+'</span>';
  else if(mv[0]==='-')m='<span style="color:#FF453A;font-family:VCNum;font-weight:700;font-size:64px;vertical-align:middle">▼'+esc(mv.slice(1))+'</span>';
  else if(mv)m='<span style="color:#aaa;font-family:VCBox;font-size:52px;vertical-align:middle">'+esc(mv)+'</span>';
  col.appendChild(el('div','','font-family:VCHead;color:#fff;font-size:170px;line-height:1;margin-top:26px','#'+esc(D.rank)+' '+m));
  const t=el('div','','width:100%;font-family:VCHead;text-transform:uppercase;color:#fff;line-height:.95',rich(D.title));col.appendChild(t);
  col.appendChild(el('div','','font-family:VCSemi;color:#e6e6e6;font-size:44px;margin-top:10px',esc(D.artist||'')));
  if(D.stats)col.appendChild(el('div','','font-family:VCBox;color:var(--accent);font-size:34px;letter-spacing:.08em;margin-top:16px;text-transform:uppercase',esc(D.stats)));
  C.appendChild(col);wordmark('bottom:40px;left:0;right:0;text-align:center');
  return[()=>fit(t,130,56,132)]}

// F6 release list card
function list(){C.style.background='#0b0b0b';const it=D.items||[];
  const bgs=D.photo||(it[0]&&it[0].cover);   // blurred background: the post photo, else the first cover
  if(bgs)C.appendChild(img(bgs,'position:absolute;left:-60px;top:-60px;width:calc(100% + 120px);height:calc(100% + 120px);filter:blur('+(D.photo?24:50)+'px) brightness('+(D.photo?.42:.3)+')'));
  const col=el('div','abs','left:64px;right:64px;top:70px;bottom:110px;display:flex;flex-direction:column');
  const t=el('div','','font-family:VCHead;text-transform:uppercase;color:#fff;line-height:.92',rich(D.title));col.appendChild(t);
  if(D.sub)col.appendChild(el('div','','font-family:VCSemi;color:#cfcfcf;font-size:34px;letter-spacing:.08em;margin:14px 0 22px;text-transform:uppercase',esc(D.sub)));
  const rh=Math.min(D.row||(it.length<=3?220:170),Math.floor((H-70-110-300)/Math.max(1,it.length))-16);
  const rows=[];
  it.forEach((x,i)=>{
    if(D.style==='prices'){const n=it.length,ls=n>6?36:n>4?40:46,ps=n>6?78:n>4?86:100,pad=n>6?17:n>4?18:24;   // price / position list: label left, number right; tighter for long lists
      const r=el('div','','display:flex;align-items:center;justify-content:space-between;gap:30px;padding:'+pad+'px 0;border-bottom:2px solid rgba(255,255,255,.16);flex:none');rows.push(r);
      r.appendChild(el('div','','font-family:VCBox;color:#fff;font-size:'+ls+'px;text-transform:uppercase;line-height:1.06;flex:1',esc(x.artist)));
      r.appendChild(el('div','','font-family:VCHead;color:var(--accent);font-size:'+ps+'px;line-height:.9;flex:none',esc(x.title)));col.appendChild(r);return}
    const r=el('div','','display:flex;align-items:center;gap:26px;margin-top:'+(i?16:0)+'px;height:'+rh+'px;flex:none');rows.push(r);
    if(x.rank)r.appendChild(el('div','','font-family:VCNum;font-weight:700;color:#fff;font-size:'+Math.round(rh*.42)+'px;width:'+Math.round(rh*.5)+'px;text-align:center;flex:none',esc(String(x.rank))));
    if(x.cover){const c=el('div','','width:'+rh+'px;height:'+rh+'px;border-radius:10px;overflow:hidden;flex:none');c.appendChild(img(x.cover));r.appendChild(c)}
    r.appendChild(el('div','','min-width:0;flex:1','<div class="la" style="font-family:VCBox;color:#fff;font-size:'+Math.round(rh*.36)+'px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(x.artist)+'</div><div class="la" style="font-family:VCSemi;color:var(--accent);font-size:'+Math.round(rh*.3)+'px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(x.title)+'</div>'));
    col.appendChild(r)});
  if(rows.length){rows[0].style.marginTop='auto';rows[rows.length-1].style.marginBottom='auto'}   // rows centred in the space under the title
  C.appendChild(col);wordmark('bottom:44px;left:0;right:0;text-align:center');
  // long names shrink (down to 40%) before they get an ellipsis; each line type then takes the smallest size so the rows match
  const shrink=()=>[0,1].forEach(k=>{const ls=[...C.querySelectorAll('.la')].filter((e,i)=>i%2===k);if(!ls.length)return;
    const sz=ls.map(e=>{let s=parseFloat(e.style.fontSize);const m=s*.4;while(e.scrollWidth>e.clientWidth&&s>m){s-=2;e.style.fontSize=s+'px'}return s});
    const m=Math.min(...sz);ls.forEach(e=>e.style.fontSize=m+'px')});
  return[()=>fit(t,128,70,250),shrink]}

// V1 split news overlay: two photos on top, white caption box, clip below (placed by ffmpeg at y=560)
function split(){const ph=D.ph||470,ps=D.photos||[];
  if(ps.length===1)boxImg(ps[0].src,'left:0;top:0;width:100%;height:'+ph+'px',ps[0].focus||'center 25%');
  else ps.slice(0,2).forEach((x,i)=>boxImg(x.src,'left:'+(i*W/2)+'px;top:0;width:'+(W/2)+'px;height:'+ph+'px',x.focus||'center 25%'));
  const wrap=el('div','abs','left:45px;right:45px;top:'+(ph-72)+'px;text-align:center');
  const b=el('div','','display:inline-block;background:#fff;border-radius:22px;padding:18px 30px 14px;box-shadow:0 6px 22px rgba(0,0,0,.35)');
  const t=el('div','','font-family:VCBox;text-transform:uppercase;color:#000;line-height:1.12',rich(D.headline));
  b.appendChild(t);wrap.appendChild(b);C.appendChild(wrap);
  return[()=>fit(t,52,32,176)]}

// F7 versus / this-or-that: two photos side by side with option names and a VS badge, question underneath (beef polls, "which pair?")
function vs(){C.style.background='#000';const ps=D.photos||[],top=V?230:0,ph=Math.round(H*(V?.37:.6));   // V = 9:16 Story still: poll sticker goes under the headline
  ps.slice(0,2).forEach((x,i)=>{boxImg(x.src,'left:'+(i*W/2)+'px;top:'+top+'px;width:'+(W/2)+'px;height:'+ph+'px',x.focus||'center 25%');
    if(x.name)C.appendChild(el('div','abs','left:'+(i*W/2)+'px;width:'+(W/2)+'px;top:'+(top+ph-96)+'px;text-align:center',
      '<span class="label" style="font-size:36px;'+(i?'background:var(--accent2);color:#fff':'')+'">'+esc(x.name)+'</span>'))});
  C.appendChild(el('div','abs','left:'+(W/2-3)+'px;top:'+top+'px;width:6px;height:'+ph+'px;background:#fff'));
  C.appendChild(el('div','abs','left:'+(W/2-78)+'px;top:'+(top+ph/2-78)+'px;width:156px;height:156px;border-radius:50%;background:#fff;color:#000;font-family:VCHead;font-size:96px;display:flex;align-items:center;justify-content:center;padding-top:8px;box-shadow:0 10px 30px rgba(0,0,0,.55)','VS'));
  const h=el('div','abs','left:60px;right:60px;top:'+(top+ph+44)+'px;text-align:center;font-family:VCHead;text-transform:uppercase;color:#fff;line-height:.94',rich(D.headline));C.appendChild(h);
  if(D.sub&&!V)C.appendChild(el('div','abs','left:60px;right:60px;bottom:'+(V?360:100)+'px;text-align:center;font-family:VCSemi;color:#cfcfcf;font-size:34px;letter-spacing:.06em;text-transform:uppercase',esc(D.sub)));
  if(!V)wordmark('bottom:40px;left:0;right:0');   // Story stills: no handle (Instagram's Story header shows the page there)
  return[()=>fit(h,130,60,(V?1290:H-110-(D.sub?60:0))-(top+ph+44))]}

// carousel slide after the cover: photo plus an optional one-line context strip (adds information: keeps the post original) and the handle
function slide(){C.style.background='#000';
  if(D.photo)C.appendChild(img(D.photo,'position:absolute;inset:0',D.focus||'center 30%'));
  let h=null;
  if(D.headline){C.appendChild(el('div','abs','left:0;right:0;bottom:0;height:40%;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.9))'));
    h=el('div','abs','left:60px;right:60px;bottom:112px;text-align:center;font-family:VCBox;text-transform:uppercase;color:#fff;line-height:1.08',rich(D.headline));C.appendChild(h)}
  wordmark('bottom:40px;left:0;right:0');
  return h?[()=>fit(h,64,34,230)]:[]}

// F8 YouTube comment card: a real comment (data from yt-dlp) in YouTube's dark style over the artist photo, headline underneath
const YT_UP='<svg viewBox="0 0 24 24" width="34" height="34"><path fill="none" stroke="#f1f1f1" stroke-width="1.6" stroke-linejoin="round" d="M7 10v10H3V10h4zm0 0 4.2-7.2c1.1 0 2 .9 2 2V9h5.6c1.2 0 2.1 1.1 1.9 2.3l-1.4 7.2c-.2 1-1 1.5-1.9 1.5H7"/></svg>';
const YT_DOWN='<svg viewBox="0 0 24 24" width="34" height="34" style="transform:rotate(180deg)"><path fill="none" stroke="#f1f1f1" stroke-width="1.6" stroke-linejoin="round" d="M7 10v10H3V10h4zm0 0 4.2-7.2c1.1 0 2 .9 2 2V9h5.6c1.2 0 2.1 1.1 1.9 2.3l-1.4 7.2c-.2 1-1 1.5-1.9 1.5H7"/></svg>';
const YT_PIN='<svg viewBox="0 0 24 24" width="26" height="26" style="vertical-align:-5px;margin-right:8px"><path fill="#aaa" d="M16 3v2h-1v5l2 3v2h-4v6l-1 1-1-1v-6H7v-2l2-3V5H8V3h8z"/></svg>';
const YT_NOTE='<svg viewBox="0 0 24 24" width="26" height="26" style="vertical-align:-5px;margin-left:8px"><circle cx="12" cy="12" r="11" fill="#aaa"/><path fill="#0f0f0f" d="M10 6.5v7.1a2.6 2.6 0 1 0 1.6 2.4V9.2h3.4V6.5z"/></svg>';
function ytc(){const c=D.comment||{};C.style.background='#000';
  if(D.photo)C.appendChild(img(D.photo,'position:absolute;inset:0;filter:brightness(.55)',D.focus||'center 30%'));
  C.appendChild(el('div','abs','left:0;right:0;bottom:0;height:60%;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.93) 55%)'));
  const box=el('div','abs','left:70px;right:70px;top:'+(D.boxY||130)+'px;background:#0f0f0f;border-radius:30px;padding:34px 38px 30px;box-shadow:0 18px 60px rgba(0,0,0,.65);color:#f1f1f1');
  box.innerHTML=(c.pinned?'<div style="font-family:VCTw;font-size:27px;color:#aaa;margin:0 0 16px 98px">'+YT_PIN+'Pinned by '+esc(c.author)+'</div>':'')+
    '<div style="display:flex;gap:24px"><img src="'+c.avatar+'" style="width:76px;height:76px;border-radius:50%;flex:none;object-fit:cover">'+
    '<div style="flex:1;min-width:0"><div style="display:flex;align-items:center;gap:14px;margin-bottom:12px">'+
    '<span style="font-family:VCTwB;font-size:29px;'+(c.uploader?'background:#3f3f3f;padding:5px 16px 5px 16px;border-radius:22px':'')+'">'+esc(c.author)+(c.artist?YT_NOTE:'')+'</span>'+
    '<span style="font-family:VCTw;font-size:27px;color:#aaa">'+esc(c.when||'')+'</span></div>'+
    '<div style="font-family:VCTw;font-size:'+(D.textSize||50)+'px;line-height:1.24;white-space:pre-line">'+esc(c.text)+'</div>'+
    '<div style="display:flex;gap:18px;align-items:center;margin-top:22px;font-family:VCTw;font-size:29px;color:#aaa">'+YT_UP+'<span>'+esc(c.likes||'')+'</span><span style="width:20px"></span>'+YT_DOWN+'<span style="width:20px"></span><span style="font-family:VCTwB;color:#f1f1f1">Reply</span></div></div></div>';
  C.appendChild(box);
  const hb=el('div','abs','left:60px;right:60px;bottom:116px;text-align:center');
  const h=el('div','','font-family:VCHead;text-transform:uppercase;color:#fff;line-height:.94;text-shadow:0 4px 18px rgba(0,0,0,.35)',rich(D.headline));hb.appendChild(h);
  if(D.sub)hb.appendChild(el('div','','font-family:VCSemi;color:#ddd;font-size:32px;margin-top:14px;letter-spacing:.05em;text-transform:uppercase',esc(D.sub)));
  C.appendChild(hb);wordmark('bottom:40px;left:0;right:0');
  return[()=>fit(h,124,56,330)]}

// V6 plain caption over a clip, the way meme and repost pages caption live clips: one sentence-case line, white, centred, page handle under it
function tt(){const w=el('div','abs','left:70px;right:70px;top:'+(D.ttY||330)+'px;text-align:center');
  const t=el('div','','font-family:VCTwB;color:#fff;line-height:1.22;text-shadow:0 3px 14px rgba(0,0,0,.85),0 0 3px rgba(0,0,0,.9)',rich(plain(D.headline),false));w.appendChild(t);
  w.appendChild(wordmark('margin-top:22px','#fff','center',true));C.appendChild(w);
  return[()=>fit(t,64,40,260)]}

const F={uk,raptv,meme,tweet,chart,list,split,vs,slide,ytc,tt};
Promise.all(['VCHead','VCMeme','VCBox','VCSemi','VCReg','VCTw','VCTwB','VCNum'].map(f=>document.fonts.load('40px '+f).catch(()=>0)))
  .then(()=>{const jobs=F[D.fmt]();return document.fonts.ready.then(()=>jobs.forEach(j=>j()))});
